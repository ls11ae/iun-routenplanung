# Veröffentlicht den Ordner webdemo/ über GitHub Pages.
# Ohne Actions könnte Pages nur das Wurzelverzeichnis oder /docs ausliefern.
# Einmalig einstellen: Settings > Pages > Build and deployment > Source: "GitHub Actions".
name: Webdemo veröffentlichen

on:
  push:
    branches: [main]
    paths:
      - "webdemo/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  veroeffentlichen:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: webdemo
      - id: deployment
        uses: actions/deploy-pages@v5
